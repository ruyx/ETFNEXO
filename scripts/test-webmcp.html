<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMCP Test Suite - ETF Nexo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: #FA8029;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .status {
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }

    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .test-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }

    button {
      background: #FA8029;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-bottom: 10px;
      transition: background 0.2s;
    }

    button:hover {
      background: #e67121;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-left: 4px solid #FA8029;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .tools-list {
      list-style: none;
      padding: 0;
    }

    .tools-list li {
      padding: 8px;
      margin: 5px 0;
      background: #f8f9fa;
      border-radius: 4px;
    }

    .event-log {
      max-height: 300px;
      overflow-y: auto;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .event-log .event {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }

    .event-log .event:last-child {
      border-bottom: none;
    }

    .event-log .timestamp {
      color: #858585;
      margin-right: 10px;
    }

    .event-log .event-name {
      color: #4ec9b0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 WebMCP Test Suite</h1>
    <p class="subtitle">ETF Nexo - Web Machine Learning Control Protocol</p>

    <!-- Status Check -->
    <div id="statusCheck"></div>

    <!-- Test 1: API Detection -->
    <div class="test-section">
      <h2>1️⃣ API Detection</h2>
      <button onclick="testAPIDetection()">Test API Detection</button>
      <div id="apiResult" class="result" style="display:none;"></div>
    </div>

    <!-- Test 2: Tool Registration -->
    <div class="test-section">
      <h2>2️⃣ Tool Registration</h2>
      <button onclick="testToolRegistration()">Test Tool Registration</button>
      <div id="toolResult" class="result" style="display:none;"></div>
    </div>

    <!-- Test 3: Search ETF Simulation -->
    <div class="test-section">
      <h2>3️⃣ Search ETF Tool</h2>
      <button onclick="testSearchETF('tecnología europea barato')">Test: "tecnología europea barato"</button>
      <button onclick="testSearchETF('ETFs sostenibles emergentes')">Test: "ETFs sostenibles emergentes"</button>
      <button onclick="testSearchETF('mejores ETFs USA')">Test: "mejores ETFs USA"</button>
      <div id="searchResult" class="result" style="display:none;"></div>
    </div>

    <!-- Test 4: Explain Term Simulation -->
    <div class="test-section">
      <h2>4️⃣ Explain Term Tool</h2>
      <button onclick="testExplainTerm('TER')">Explain: TER</button>
      <button onclick="testExplainTerm('tracking error')">Explain: Tracking Error</button>
      <button onclick="testExplainTerm('ESG')">Explain: ESG</button>
      <div id="explainResult" class="result" style="display:none;"></div>
    </div>

    <!-- Event Log -->
    <div class="test-section">
      <h2>📋 Event Log</h2>
      <button onclick="clearEventLog()">Clear Log</button>
      <div id="eventLog" class="event-log"></div>
    </div>
  </div>

  <script>
    // Event Log
    const eventLog = [];

    function logEvent(eventName, data) {
      const timestamp = new Date().toLocaleTimeString();
      eventLog.push({ timestamp, eventName, data });
      updateEventLog();
    }

    function updateEventLog() {
      const logEl = document.getElementById('eventLog');
      logEl.innerHTML = eventLog.map(e =>
        `<div class="event">
          <span class="timestamp">[${e.timestamp}]</span>
          <span class="event-name">${e.eventName}</span>
          <div>${JSON.stringify(e.data, null, 2)}</div>
        </div>`
      ).reverse().join('');
    }

    function clearEventLog() {
      eventLog.length = 0;
      updateEventLog();
    }

    // Listen to WebMCP events
    window.addEventListener('webmcp:initialized', (e) => logEvent('webmcp:initialized', e.detail));
    window.addEventListener('webmcp:tool-invoked', (e) => logEvent('webmcp:tool-invoked', e.detail));
    window.addEventListener('webmcp:tool-completed', (e) => logEvent('webmcp:tool-completed', e.detail));
    window.addEventListener('webmcp:tool-error', (e) => logEvent('webmcp:tool-error', e.detail));
    window.addEventListener('webmcp:search-results', (e) => logEvent('webmcp:search-results', e.detail));
    window.addEventListener('webmcp:term-explained', (e) => logEvent('webmcp:term-explained', e.detail));

    // Check Status on Load
    window.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.getElementById('statusCheck');
      const isSupported = 'modelContext' in document;

      if (isSupported) {
        statusEl.innerHTML = `
          <div class="status success">
            ✅ WebMCP API Detected<br>
            Browser: ${navigator.userAgent.includes('Chrome') ? 'Chrome' : 'Unknown'}<br>
            Ready to test tools
          </div>
        `;
      } else {
        statusEl.innerHTML = `
          <div class="status error">
            ❌ WebMCP API Not Available<br><br>
            <strong>To enable:</strong><br>
            1. Use Chrome Canary<br>
            2. Go to <span class="code">chrome://flags/#optimization-guide-on-device-model</span><br>
            3. Set to "Enabled"<br>
            4. Restart browser
          </div>
        `;
      }
    });

    // Test 1: API Detection
    function testAPIDetection() {
      const resultEl = document.getElementById('apiResult');
      resultEl.style.display = 'block';

      const checks = {
        'document.modelContext': 'modelContext' in document,
        'window.__ETF_NEXO_WEBMCP_ENABLED__': window.__ETF_NEXO_WEBMCP_ENABLED__ || false,
      };

      resultEl.textContent = JSON.stringify(checks, null, 2);
    }

    // Test 2: Tool Registration
    function testToolRegistration() {
      const resultEl = document.getElementById('toolResult');
      resultEl.style.display = 'block';

      if (!('modelContext' in document)) {
        resultEl.textContent = 'ERROR: modelContext API not available';
        return;
      }

      try {
        // Mock tool registration
        const mockTool = {
          name: 'test-mock-tool',
          description: 'Test tool for verification',
          inputSchema: {
            type: 'object',
            properties: {
              query: { type: 'string', description: 'Test query' }
            },
            required: ['query']
          },
          execute: async (args) => {
            console.log('[TEST] Mock tool executed:', args);
            return { success: true, args };
          }
        };

        document.modelContext.registerTool(mockTool).then(() => {
          resultEl.textContent = `✅ Tool registered successfully:\n\n${JSON.stringify(mockTool, null, 2)}`;
        }).catch(error => {
          resultEl.textContent = `❌ Registration failed:\n\n${error.message}`;
        });
      } catch (error) {
        resultEl.textContent = `❌ Error:\n\n${error.message}`;
      }
    }

    // Test 3: Search ETF
    function testSearchETF(query) {
      const resultEl = document.getElementById('searchResult');
      resultEl.style.display = 'block';

      // Simulate search results event
      const mockETFs = [
        { ticker: 'IWDA.AS', name: 'iShares Core MSCI World', ter: 0.002, aum: 75000000000, etfnexo_score: 8.9, region: 'Global', sector: 'Diversified' },
        { ticker: 'VWCE.DE', name: 'Vanguard FTSE All-World', ter: 0.0022, aum: 15000000000, etfnexo_score: 8.7, region: 'Global', sector: 'Diversified' },
        { ticker: 'CSPX.L', name: 'iShares Core S&P 500', ter: 0.0007, aum: 90000000000, etfnexo_score: 9.1, region: 'USA', sector: 'Large Cap' }
      ];

      window.dispatchEvent(new CustomEvent('webmcp:search-results', {
        detail: {
          etfs: mockETFs,
          query: query,
          filters: { region: 'Europe', sector: 'Technology', maxTER: 0.003 }
        }
      }));

      resultEl.textContent = `✅ Search event emitted:\n\nQuery: "${query}"\nETFs found: ${mockETFs.length}\n\nCheck Event Log below for details.`;
    }

    // Test 4: Explain Term
    function testExplainTerm(term) {
      const resultEl = document.getElementById('explainResult');
      resultEl.style.display = 'block';

      const definitions = {
        'TER': {
          definition: 'Total Expense Ratio (TER) es el porcentaje de gastos anuales que cobra el ETF.',
          example: 'Un ETF con TER de 0.20% significa que por cada €10,000 invertidos, pagarás €20 al año.',
          importance: 'high'
        },
        'tracking error': {
          definition: 'Tracking Error mide cuánto se desvía la rentabilidad del ETF respecto a su índice.',
          example: 'Si el S&P 500 sube +10% y tu ETF sube +9.85%, el tracking error es ~0.15%.',
          importance: 'high'
        },
        'ESG': {
          definition: 'ESG (Environmental, Social, Governance) son criterios de inversión sostenible.',
          example: 'Un ETF ESG excluiría empresas de tabaco, armas, o con alta huella de carbono.',
          importance: 'high'
        }
      };

      const data = definitions[term] || {
        definition: `Definición de "${term}" no encontrada en glosario embebido.`,
        importance: 'medium'
      };

      window.dispatchEvent(new CustomEvent('webmcp:term-explained', {
        detail: {
          term,
          ...data,
          relatedArticles: []
        }
      }));

      resultEl.textContent = `✅ Explain event emitted:\n\nTerm: "${term}"\nDefinition: ${data.definition}\n\nCheck Event Log below for details.`;
    }
  </script>
</body>
</html>
